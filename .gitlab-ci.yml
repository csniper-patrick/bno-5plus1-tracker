# GitLab CI/CD Pipeline for deploying Vue 3 + Vite app to GitLab Pages
image: docker.io/library/node:lts

stages:
  - test
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  before_script:
    - apt-get update && apt-get install -y locales && locale-gen en_GB.UTF-8 zh_HK.UTF-8 en_HK.UTF-8
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - export VITE_CI_PROJECT_URL=$CI_PROJECT_URL
    - export VITE_CI_PAGES_URL=$CI_PAGES_URL
    - export CI_PAGES_URL=$CI_PAGES_URL
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
