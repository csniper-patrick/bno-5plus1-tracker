<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E20"/>
      <stop offset="50%" stop-color="#012169"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#4A90E2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowRed)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>

  <!-- Top Header Row -->
  <g transform="translate(64, 48)">
    <!-- App Favicon Logo (Official App Favicon) -->
    <g filter="url(#iconShadow)">
      <rect width="52" height="52" rx="13" fill="#012169" stroke="#4A90E2" stroke-width="1.5"/>
      <g transform="translate(6.5, 6.5) scale(1.625)">
        <path fill="#FFFFFF" d="M 18 2 L 6 2 C 4.89 2 4 2.89 4 4 L 4 20 C 4 21.11 4.89 22 6 22 L 18 22 C 19.11 22 20 21.11 20 20 L 20 4 C 20 2.89 19.11 2 18 2 M 18 20 L 6 20 L 6 4 L 18 4 L 18 20 M 12 6 C 9.79 6 8 7.79 8 10 C 8 12.21 9.79 14 12 14 C 14.21 14 16 12.21 16 10 C 16 7.79 14.21 6 12 6 M 12 12 C 10.9 12 10 11.1 10 10 C 10 8.9 10.9 8 12 8 C 13.1 8 14 8.9 14 10 C 14 11.1 13.1 12 12 12 M 17 17 L 7 17 L 7 15 L 17 15 L 17 17 Z"/>
      </g>
    </g>
    
    <text x="68" y="35" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">BNO 5+1 TRACKER</text>
    
    <!-- Top Right Badges -->
    <g transform="translate(680, 8)">
      <!-- Privacy Badge -->
      <rect x="0" y="0" width="200" height="34" rx="17" fill="#064E3B" fill-opacity="0.75" stroke="#10B981" stroke-width="1.5"/>
      <text x="100" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🛡️ 100% Local Storage</text>

      <!-- PWA Badge -->
      <rect x="215" y="0" width="175" height="34" rx="17" fill="#78350F" fill-opacity="0.75" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="302" y="22" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡ Free Offline PWA</text>
    </g>
  </g>

  <!-- Main Hero Title & Bilingual Subtitle -->
  <g transform="translate(64, 175)">
    <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5">UK Settlement &amp; Absence Tracker</text>
    <text x="0" y="44" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">BNO 5+1 離英天數計算器 &amp; 5年永居文件清單</text>
  </g>

  <!-- 3 Feature Cards Grid -->
  <g transform="translate(64, 280)">
    <!-- Card 1: 180-Day Rolling Rule -->
    <g transform="translate(0, 0)">
      <rect width="338" height="180" rx="16" fill="#1C2541" fill-opacity="0.85" stroke="#4A90E2" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)"/>
      <circle cx="36" cy="38" r="16" fill="#0284C7" fill-opacity="0.25"/>
      <text x="36" y="44" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✈️</text>
      <text x="64" y="43" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">180-Day Rolling Rule</text>
      <text x="24" y="85" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="normal">
        <tspan x="24" dy="0">Continuous 365-day rolling</tspan>
        <tspan x="24" dy="20">window absence scanner with</tspan>
        <tspan x="24" dy="20">ILR period delay protection.</tspan>
      </text>
      <rect x="24" y="140" width="130" height="22" rx="11" fill="#0284C7" fill-opacity="0.25"/>
      <text x="89" y="155" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ILR Settlement</text>
    </g>

    <!-- Card 2: 450-Day Naturalisation -->
    <g transform="translate(366, 0)">
      <rect width="338" height="180" rx="16" fill="#1C2541" fill-opacity="0.85" stroke="#CF142B" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)"/>
      <circle cx="36" cy="38" r="16" fill="#C8102E" fill-opacity="0.25"/>
      <text x="36" y="44" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🇬🇧</text>
      <text x="64" y="43" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">450-Day Naturalisation</text>
      <text x="24" y="85" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="normal">
        <tspan x="24" dy="0">5-year citizenship limits, 90-day</tspan>
        <tspan x="24" dy="20">final year rule &amp; 5-yr physical</tspan>
        <tspan x="24" dy="20">presence validation.</tspan>
      </text>
      <rect x="24" y="140" width="140" height="22" rx="11" fill="#C8102E" fill-opacity="0.25"/>
      <text x="94" y="155" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">British Citizenship</text>
    </g>

    <!-- Card 3: Document Vault & Proofs -->
    <g transform="translate(732, 0)">
      <rect width="338" height="180" rx="16" fill="#1C2541" fill-opacity="0.85" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)"/>
      <circle cx="36" cy="38" r="16" fill="#059669" fill-opacity="0.25"/>
      <text x="36" y="44" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">📁</text>
      <text x="64" y="43" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">Document Vault &amp; Proofs</text>
      <text x="24" y="85" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="normal">
        <tspan x="24" dy="0">Life in UK (URN), English B1,</tspan>
        <tspan x="24" dy="20">Council Tax checklist, address log</tspan>
        <tspan x="24" dy="20">&amp; encrypted file storage.</tspan>
      </text>
      <rect x="24" y="140" width="135" height="22" rx="11" fill="#059669" fill-opacity="0.25"/>
      <text x="91" y="155" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Checklist &amp; Vault</text>
    </g>
  </g>

  <!-- Bottom Footer Line -->
  <line x1="64" y1="520" x2="1136" y2="520" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  
  <g transform="translate(64, 558)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Independent 3rd-Party App for Hong Kong BNO Visa Holders • Stored Locally in Browser IndexedDB</text>
    <text x="1072" y="0" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">https://csniper.gitlab.io/bno-5plus1-tracker/</text>
  </g>
</svg>
